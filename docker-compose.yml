services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=dsmrdb
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - BATTERY_START=${BATTERY_START}
      - SOLAREDGE_API_KEY=${SOLAREDGE_API_KEY}
      - SOLAREDGE_SITE_ID=${SOLAREDGE_SITE_ID}
      - WEATHER_DATA_START=${WEATHER_DATA_START:-2019-01-01}
      - SITE_LAT=${SITE_LAT:-52.0}
      - SITE_LON=${SITE_LON:-4.5}
      - PANEL_TILT=${PANEL_TILT:-35}
      - PANEL_AZIMUTH=${PANEL_AZIMUTH:-180}
      - PANEL_TEMP_COEF=${PANEL_TEMP_COEF:-0.0040}
      - GHI_MAX=${GHI_MAX:-900.0}
      - BATTERY_KWH=${BATTERY_KWH:-8.0}
      - NED_API_KEY=${NED_API_KEY}
    networks:
      - dsmreader
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.energy.entrypoints=websecure"
      - "traefik.http.routers.energy.rule=Host(`${DASHBOARD_HOST}`)"
      - "traefik.http.routers.energy.tls=true"
      - "traefik.http.services.energy.loadbalancer.server.port=8000"
      - "traefik.http.services.energy.loadbalancer.server.scheme=http"

networks:
  dsmreader:
    external: true
