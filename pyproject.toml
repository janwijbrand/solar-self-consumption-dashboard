[project]
name = "energy-dashboard"
version = "0.1.0"
description = "Solar energy monitoring and battery simulation dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/..."   # placeholder

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
